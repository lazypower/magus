[Timer]
# Container tag refresh, daily at 2am Central, clear of the OS window.
# 07:00 UTC = 2am CDT, 08:00 UTC = 2am CST; the 1hr window covers both DST
# states and still finishes before the Tuesday 09:00 UTC bootc run, so an
# image pull is never cut off by that reboot. Containers refresh daily even
# though the substrate moves weekly — restarting one costs nothing.
OnCalendar=
OnCalendar=*-*-* 07:00:00
RandomizedDelaySec=1h
Persistent=true
